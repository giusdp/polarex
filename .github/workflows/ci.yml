name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip tests]')"
    env:
      MIX_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Cache mise tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/mise
          key: ${{ runner.os }}-mise-${{ hashFiles('mise.toml') }}
          restore-keys: ${{ runner.os }}-mise-

      - name: Cache mix deps
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Get deps
        run: mix deps.get

      - name: Format check
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Force-sync tags
        run: git fetch --tags --force --prune-tags origin

      - name: Determine next version (dry run)
        id: dryrun
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          dry_run: true
          extra_plugins: |
            conventional-changelog-conventionalcommits@9.1.0
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
            @google/semantic-release-replace-plugin@1.2.7
          branches: |
            ['main']
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Abort if target tag already exists
        if: steps.dryrun.outputs.new_release_published == 'true'
        run: |
          NEXT="${{ steps.dryrun.outputs.new_release_version }}"
          if git ls-remote --tags origin "v$NEXT" | grep -q "refs/tags/v$NEXT$"; then
            echo "::error::Tag v$NEXT already exists on origin."
            echo "::error::This usually means the tag is orphaned (not in main ancestry)."
            echo "::error::To fix: move the tag to an in-ancestry commit, then re-run."
            exit 1
          fi
          echo "Tag v$NEXT is free. Proceeding with release."

      - name: Run semantic-release
        if: steps.dryrun.outputs.new_release_published == 'true'
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@9.1.0
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
            @google/semantic-release-replace-plugin@1.2.7
          branches: |
            ['main']
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
