name: Sync OpenAPI Spec

on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "polarex-bot"
          git config user.email "polarex-bot@users.noreply.github.com"

      - name: Snapshot previous spec
        run: cp openapi.json /tmp/openapi.previous.json

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Cache mix deps
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Get deps
        run: mix deps.get

      - name: Regenerate SDK
        run: mix sdk.build

      - name: Detect change
        id: diff
        run: |
          if git diff --quiet openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No spec change."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify with oasdiff
        if: steps.diff.outputs.changed == 'true'
        id: classify
        run: |
          set -euo pipefail

          run_oasdiff() {
            docker run --rm \
              -v /tmp/openapi.previous.json:/specs/previous.json:ro \
              -v "${{ github.workspace }}/openapi.json:/specs/current.json:ro" \
              tufin/oasdiff:latest "$@"
          }

          run_oasdiff changelog /specs/previous.json /specs/current.json --format json > /tmp/changelog.json
          run_oasdiff breaking  /specs/previous.json /specs/current.json --format json > /tmp/breaking.json
          run_oasdiff changelog /specs/previous.json /specs/current.json --format text > /tmp/changelog.txt || true
          run_oasdiff breaking  /specs/previous.json /specs/current.json --format text > /tmp/breaking.txt || true

          BREAKING_COUNT=$(jq 'length' /tmp/breaking.json)
          ENDPOINT_ADDED_COUNT=$(jq '[.[] | select(.id == "endpoint-added")] | length' /tmp/changelog.json)

          echo "breaking_count=$BREAKING_COUNT" >> "$GITHUB_OUTPUT"
          echo "endpoint_added_count=$ENDPOINT_ADDED_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$BREAKING_COUNT" -gt 0 ]; then
            echo "kind=breaking" >> "$GITHUB_OUTPUT"
            echo "subject=feat(spec): sync OpenAPI spec" >> "$GITHUB_OUTPUT"
          elif [ "$ENDPOINT_ADDED_COUNT" -gt 0 ]; then
            echo "kind=feat" >> "$GITHUB_OUTPUT"
            echo "subject=feat(spec): sync OpenAPI spec" >> "$GITHUB_OUTPUT"
          else
            echo "kind=chore" >> "$GITHUB_OUTPUT"
            echo "subject=chore(spec): sync OpenAPI spec" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR body
        if: steps.diff.outputs.changed == 'true'
        id: body
        run: |
          {
            echo "Automated OpenAPI spec sync."
            echo
            echo "## Classification"
            echo
            echo "- Kind: \`${{ steps.classify.outputs.kind }}\`"
            echo "- Commit subject: \`${{ steps.classify.outputs.subject }}\`"
            echo
            echo "Auto-merges when CI passes."
            echo
            echo "## oasdiff changelog"
            echo
            echo '```'
            cat /tmp/changelog.txt 2>/dev/null || echo "(no semantic changes detected)"
            echo '```'
            if [ "${{ steps.classify.outputs.breaking_count }}" -gt 0 ]; then
              echo
              echo "## Breaking changes"
              echo
              echo '```'
              cat /tmp/breaking.txt
              echo '```'
            fi
          } > /tmp/pr-body.md

      - name: Create branch and commit
        if: steps.diff.outputs.changed == 'true'
        id: branch
        run: |
          BRANCH="chore/spec-sync-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add openapi.json lib/polarex
          git commit -m "${{ steps.classify.outputs.subject }}"
          git push -u origin "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open PR and enable auto-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh pr create \
            --title "${{ steps.classify.outputs.subject }}" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "${{ steps.branch.outputs.name }}"
          gh pr merge "${{ steps.branch.outputs.name }}" --auto --squash
